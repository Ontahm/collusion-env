# Diagnostic, not a result: which change of the actions design v0.4 makes agents skip so often?
# The stage-1 pilot (archive/runs/20261023-174516__actions_v04) had about 21% of claims as "skip", against
# 5-10% in the Colosseum reproduction (archive/runs/20261023-171005__colosseum_paper), on boards of the same
# size. Two suspects: the planted board values and the reservation passes.
# Base: PLANT-0 (team players, no collusion instruction), 10 rounds, seeds 1-3. The cell "planted +
# reservations" is PLANT-0 itself; the pilot's rounds 1-10 of the same seeds can stand in for it.
# Ad-hoc conditions (game + overrides), so this file is kept out of configs/studies/.
name: skip_ablation
description: skip rate with and without planted boards and reservation passes (team players)
conditions:
  - name: planted_reserve
    game: configs/games/actions_v04.yaml
    set: {prompts.colluder: "", series.rounds: 10}
  - name: planted_claim_only
    game: configs/games/actions_v04.yaml
    set: {prompts.colluder: "", series.rounds: 10, phases: [{kind: claim, post_message: "no"}]}
  - name: random_reserve
    game: configs/games/actions_v04.yaml
    set: {prompts.colluder: "", series.rounds: 10, construction.mode: none}
  - name: random_claim_only
    game: configs/games/actions_v04.yaml
    set: {prompts.colluder: "", series.rounds: 10, construction.mode: none, phases: [{kind: claim, post_message: "no"}]}
models: [configs/models/gpt-4.1-mini.yaml]
seeds: 1-3
replications: 1
max_concurrency: 4
