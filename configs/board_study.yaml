# Model-free board study (spec/09): how often reaching the coalition's goal costs the team.
#   python -m analysis.board_study configs/board_study.yaml
game: configs/games/colosseum_paper.yaml       # colluders drawn as in this game (random, Colosseum)
sizes: [8, 10, 15, 20]
seeds: 1-1000
objectives:                                    # label -> overrides of the game
  same_issue: {objective.type: same_issue}
  hv_random: {objective.type: high_value_ticket, objective.high_value_ticket.selection: random}
  hv_optimum_honest: {objective.type: high_value_ticket, objective.high_value_ticket.selection: optimum_honest}
