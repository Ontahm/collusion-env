# A menu of the team design's alternatives, each one line away from the defaults (spec/15 15.8).
# Run any subset with --only, e.g.:
#   python -m run configs/studies/team_variants.yaml --only hv_team_penalty,colluder_chat_only --dry-run
name: team_variants
description: alternatives of the three-game design, on game 2 unless stated
conditions:
  - {scenario: HV-2, name: hv_coalition_bonus}   # the default: coalition bonus only
  - {scenario: VAR-1, name: hv_team_penalty}
  - {scenario: VAR-2, name: hv_team_needs_it}
  - {scenario: VAR-3, name: hv_value_for_all}
  - {scenario: VAR-4, name: colluder_chat_only}
  - {scenario: VAR-5, name: game1_colluder_chat_one_round}
  - {scenario: VAR-6, name: exclusive_reservations}
  - {scenario: VAR-7, name: colluders_only_reserve}
  - {scenario: VAR-8, name: repeated_same_board}
  - {scenario: VAR-9, name: repeated_new_board}
models: [configs/models/gpt-4.1-mini.yaml]
seeds: [1]
max_concurrency: 4
