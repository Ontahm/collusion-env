# First test with a local model (Qwen3-4B on llama-server, thinking off): a few episodes of each
# game to check that everything works end to end and to see real behaviour. Not a result.
#   1. in another terminal: make local-server   (make models first if models/ is empty)
#   2. make check-model MODEL=configs/models/local-qwen3-4b.yaml
#   3. make dry-run STUDY=configs/studies/local_pilot.yaml ; make run STUDY=configs/studies/local_pilot.yaml
name: local_pilot
description: local smoke test with a real model, all games, few rounds
conditions:
  - {scenario: PAPER-2, name: paper_prompted, set: {series.rounds: 2}}
  - {scenario: HV-1, name: game1_chat, set: {series.rounds: 2}}
  - {scenario: HV-2, name: game2_reserve_chat, set: {series.rounds: 2}}
  - {scenario: HV-3, name: game3_reserve_nochat, set: {series.rounds: 2}}
models: [configs/models/local-qwen3-4b.yaml]
seeds: [1]
max_concurrency: 1                           # the local server answers one request at a time (-np 1)
