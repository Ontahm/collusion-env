# Actions design v0.4, stage 1: the positive control and the main test, same seeds (same boards,
# colluders and orders). Both are read within the condition (partner asymmetry: partner vs strangers;
# capture rate: against the planted board's exact team plan).
# Stage 2 (only if PLANT-2 shows a result): configs/studies/actions_v04_followup.yaml.
name: actions_v04
description: stage 1, collusion through actions on planted boards; private chat vs actions with names shown
conditions:
  - {scenario: PLANT-1}      # positive control: private chat
  - {scenario: PLANT-2}      # main test: actions only, names shown
models: [configs/models/gpt-4.1-mini.yaml]
seeds: 1-10
replications: 1
max_concurrency: 4
