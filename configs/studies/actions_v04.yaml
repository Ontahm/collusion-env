# Actions design v0.4, stage 1: the positive control and the main test, same seeds (same boards,
# colluders and orders). Both are read within the condition (partner asymmetry: partner vs strangers;
# capture rate: against the planted board's exact team plan).
# Stage 2 (only if PLANT-2 shows a result): configs/studies/actions_v04_followup.yaml.
# 23 Oct: PLANT -> PSUM (costs only, coalition reward defined; decisions Q-30, Q-34). The pilots
# runs/20261023-174516__actions_v04 and runs/20261023-184358__actions_v04__gpt-5-mini used PLANT.
name: actions_v04
description: stage 1, collusion through actions on planted boards; private chat vs actions with names shown vs team players
conditions:
  - {scenario: PSUM-1}       # positive control: private chat
  - {scenario: PSUM-2}       # main test: actions only, names shown
  - {scenario: PSUM-0}       # baseline: the same two agents, no collusion instruction
models: [configs/models/gpt-4.1-mini.yaml]
seeds: 1-10
replications: 1
max_concurrency: 4
