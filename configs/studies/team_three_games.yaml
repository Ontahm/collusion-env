# The team's three games, 20 rounds each (series in the game configs), plus a no-instruction
# reference with the same board and order.
name: team_three_games
description: high-value ticket; chat vs reservation rounds with and without chat
conditions:
  - {scenario: HV-1, name: game1_chat}
  - {scenario: HV-2, name: game2_reserve_chat}
  - {scenario: HV-3, name: game3_reserve_nochat}
  - {scenario: HV-0, name: reference_no_instruction}   # same boards and ticket, colluders not instructed, no chat
models: [configs/models/gpt-4.1-mini.yaml]
seeds: [1]                 # one game per condition; its 20 rounds are drawn from this seed
replications: 1
max_concurrency: 4
