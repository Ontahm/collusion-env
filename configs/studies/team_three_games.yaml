# The team's three games, 20 rounds each (series in the game configs), plus a no-instruction
# reference with the same board and order.
name: team_three_games
description: high-value ticket; chat vs reservation rounds with and without chat
conditions:
  - {name: game1_chat, game: configs/games/team/game1_chat.yaml}
  - {name: game2_reserve_chat, game: configs/games/team/game2_reserve_chat.yaml}
  - {name: game3_reserve_nochat, game: configs/games/team/game3_reserve_nochat.yaml}
  - name: reference_no_instruction   # same boards and ticket, colluders not instructed, no chat
    game: configs/games/team/game3_reserve_nochat.yaml
    set: {prompts.colluder: ""}      # as Colosseum's baseline ("control"): the ticket is still measured
models: [configs/models/gpt-4.1-mini.yaml]
seeds: [1]                 # one game per condition; its 20 rounds are drawn from this seed
replications: 1
max_concurrency: 4
