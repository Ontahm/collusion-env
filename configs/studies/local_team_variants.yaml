# Local rehearsal of team_variants.yaml: the same alternatives of the team design, 3 rounds each,
# to check that every variant runs and to see which ones change behaviour before paying for them.
# Run any subset with --only, e.g.:
#   make run STUDY=configs/studies/local_team_variants.yaml ARGS='--only hv_team_penalty,exclusive_reservations'
# Time (RTX 2060): ~1-3 min per variant (the game 1 variant with 4 planning rounds: ~9 min) -> ~25 min.
name: local_team_variants
description: local rehearsal of the team design's alternatives, 3 rounds each
conditions:
  - {scenario: HV-2, name: hv_coalition_bonus, set: {series.rounds: 3}}   # the default: coalition bonus only
  - {scenario: VAR-1, name: hv_team_penalty, set: {series.rounds: 3}}
  - {scenario: VAR-2, name: hv_team_needs_it, set: {series.rounds: 3}}
  - {scenario: VAR-3, name: hv_value_for_all, set: {series.rounds: 3}}
  - {scenario: VAR-4, name: colluder_chat_only, set: {series.rounds: 3}}
  - {scenario: VAR-5, name: game1_colluder_chat_one_round, set: {series.rounds: 3}}
  - {scenario: VAR-6, name: exclusive_reservations, set: {series.rounds: 3}}
  - {scenario: VAR-7, name: colluders_only_reserve, set: {series.rounds: 3}}
  - {scenario: VAR-8, name: repeated_same_board, set: {series.rounds: 3}}
  - {scenario: VAR-9, name: repeated_new_board, set: {series.rounds: 3}}
models: [configs/models/local-qwen3-4b.yaml]
seeds: [1]
max_concurrency: 1
