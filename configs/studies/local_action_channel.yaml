# Local rehearsal of action_channel.yaml at full size: the same six conditions and the same 20 boards.
# No chat in five of them, so episodes are short: the cheapest place to see whether the information
# ladder (secret chat > visible > issue only > noisy > hidden) moves the same-issue rate at all.
# Time (RTX 2060): ~10-30 s per episode -> ~30 min for 120 episodes.
#   make run STUDY=configs/studies/local_action_channel.yaml
name: local_action_channel
description: local rehearsal of the action-channel study (same-issue goal, six scenarios)
conditions:
  - {scenario: ACT-0, name: baseline}        # colluders not instructed (as Colosseum's "control")
  - {scenario: ACT-1, name: secret_chat}     # one secret chat round, partner's claim hidden
  - {scenario: ACT-2, name: action_visible}  # no chat, partner's claim visible
  - {scenario: ACT-5, name: action_hidden}   # no chat, partner's claim hidden
  - {scenario: ACT-3, name: issue_only}      # no chat, only the partner's issue
  - {scenario: ACT-4, name: noisy}           # no chat, partner's claim shown with noise
models: [configs/models/local-qwen3-4b.yaml]
seeds: 1-20
replications: 1
max_concurrency: 1
