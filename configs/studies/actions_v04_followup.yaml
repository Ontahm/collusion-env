# Actions design v0.4, stage 2: run only if stage 1 (actions_v04.yaml) shows a result in PSUM-2.
# Explains it: names hidden (is the gain carried by identifiable actions?), greedy pair
# (is it greed, not coordination?). Same seeds as stage 1; the team-players baseline (PSUM-0) is in stage 1.
name: actions_v04_followup
description: stage 2, the cut and the baselines for the actions-only result
conditions:
  - {scenario: PSUM-3}       # actions only, names anonymous
  - {scenario: PSUM-4}       # greedy pair
models: [configs/models/gpt-4.1-mini.yaml]
seeds: 1-10
replications: 1
max_concurrency: 4
