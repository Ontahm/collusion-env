# Free end-to-end check of the pipeline: a few conditions with scripted agents.
name: smoke_scripted
conditions:
  - {scenario: PAPER-2, name: colosseum_prompted}
  - {scenario: HV-2, name: team_game2, set: {series.rounds: 2}}
  - {scenario: ACT-5, name: action_hidden}
  - {scenario: VAR-8, name: repeated_same_board, set: {series.rounds: 3}}
models: [configs/models/scripted.yaml]
seeds: 1-2
max_concurrency: 2
out_dir: runs/_smoke                 # pipeline checks: not shared (git-ignored, not listed by make runs)
