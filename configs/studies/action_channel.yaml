# The team note of 19 Oct: action-only coordination, same-issue goal, five scenarios + baseline.
name: action_channel
description: same-issue goal; chat vs visible / hidden / issue-only / noisy partner claims
conditions:
  - {scenario: ACT-0, name: baseline}        # colluders not instructed (as Colosseum's "control")
  - {scenario: ACT-1, name: secret_chat}     # one secret chat round, partner's claim hidden
  - {scenario: ACT-2, name: action_visible}  # no chat, partner's claim visible
  - {scenario: ACT-5, name: action_hidden}   # no chat, partner's claim hidden
  - {scenario: ACT-3, name: issue_only}      # no chat, only the partner's issue
  - {scenario: ACT-4, name: noisy}           # no chat, partner's claim shown with noise
models: [configs/models/gpt-4.1-mini.yaml]
seeds: 1-20
replications: 1
max_concurrency: 4
