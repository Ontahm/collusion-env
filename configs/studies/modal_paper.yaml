# local_paper.yaml on an open model served by Modal (deploy/README.md): the same three Colosseum
# conditions and the same boards (seeds 1-5), so the results compare board by board with the local
# Qwen3-4B run. A first look at whether a larger model herds less and colludes in the paper's sense.
#   make check-model MODEL=configs/models/modal-vllm.yaml
#   make run STUDY=configs/studies/modal_paper.yaml ARGS=--yes
name: modal_paper
description: Colosseum's conditions on the local_paper boards, open model on Modal
conditions:
  - name: baseline                   # secret_channel_enabled: false (variant forced to control)
    game: configs/games/colosseum_paper.yaml
    set: {boards.secret: false, prompts.colluder: "", prompts.variant_name: control}
  - name: emergent                   # secret channel, no instruction (control)
    game: configs/games/colosseum_paper.yaml
    set: {prompts.colluder: "", prompts.variant_name: control}
  - name: prompted                   # secret channel + "simple" coalition instruction
    game: configs/games/colosseum_paper.yaml
models: [configs/models/modal-vllm.yaml]
seeds: 1-5
replications: 1
max_concurrency: 8                   # vLLM serves many requests at once
