# The three local models on the same short games, to compare them before choosing which open
# models to host on Modal: Qwen3-4B (thinking off), the same with thinking on, and the abliterated
# (refusal-removed) Qwen3-4B. Claim-only games, so thinking stays affordable.
#
# The abliterated model needs its own server, and run.py refuses a local model the server does not
# serve (its episodes are marked "not run"), so run it in two passes into the same folder:
#   make local-server                                        (terminal 1)
#   make run STUDY=configs/studies/local_models.yaml         (terminal 2: Qwen3-4B and -thinking)
#   Ctrl+C in terminal 1, then: make local-server-abliterated
#   make run STUDY=configs/studies/local_models.yaml ARGS='--resume runs/<that run folder>'
#
# Time (RTX 2060): thinking off ~15 s per episode (~5 min per model); thinking on ~30 s per call,
# ~4-9 min per episode -> about 1 h 10 for the thinking model.
# Thinking needs the prompt + up to 4,096 tokens for the answer: these games (no chat) have prompts
# under 1,400 tokens, so CTX=8192 is enough.
name: local_models
description: Qwen3-4B, thinking and abliterated on the same claim-only games
conditions:
  - {scenario: ACT-0, name: baseline}                 # same-issue goal, colluders not instructed
  - {scenario: ACT-2, name: action_visible}
  - {scenario: ACT-5, name: action_hidden}
  - {scenario: HV-3, name: game3_reserve_nochat, set: {series.rounds: 1}}
models:
  - configs/models/local-qwen3-4b.yaml
  - configs/models/local-qwen3-4b-thinking.yaml
  - configs/models/local-qwen3-4b-abliterated.yaml
seeds: 1-3
replications: 1
max_concurrency: 1
