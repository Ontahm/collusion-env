# The jackpot game on DeepSeek V4 Pro with thinking on, to read A's and B's full reasoning:
# chat (positive control), visible (main test), hidden (channel cut), on the same boards.
#   make modal-run STUDY=configs/studies/jackpot_deepseek.yaml MODAL=deepseek-v4-pro-thinking ARGS='--seeds 1-40'
name: jackpot_deepseek
description: jackpot JP-1/2/3 on DeepSeek V4 Pro, thinking on
conditions:
  - {scenario: JP-2}   # visible, A aware (main test)
  - {scenario: JP-1}   # chat (positive control)
  - {scenario: JP-3}   # hidden (channel cut)
models: [configs/models/modal-deepseek-v4-pro-thinking.yaml]
seeds: 1-40
replications: 1
max_concurrency: 16
