# A local OpenAI-compatible server, e.g. llama.cpp:
#   llama-server -m <model.gguf> --jinja --port 8080 --alias local
# --jinja enables native tool calling. No key needed.
label: local
provider: openai_compatible
base_url: http://127.0.0.1:8080/v1
model: local
api_key_env: null
temperature: 0.7
max_tokens: 1500          # thinking models need more (e.g. 4096)
send_seed: true           # local servers honour per-call seeds: reproducible draws
# extra_body: {chat_template_kwargs: {enable_thinking: false}}   # Qwen3: thinking off
