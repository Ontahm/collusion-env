# gpt-5-mini through OpenAI's Responses API, with its reasoning summaries logged (the chat API returns
# none). Logged in calls.jsonl as response.choices[0].message.reasoning; the raw answer as raw_response.
# The summary is OpenAI's paraphrase of the reasoning, not the reasoning itself.
extends: ./gpt-5-mini.yaml
label: gpt-5-mini-summaries
api: responses
reasoning_summary: detailed   # "auto" returned no summary in a test call (25 Oct); "detailed" did
