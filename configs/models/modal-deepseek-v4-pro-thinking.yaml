# DeepSeek V4 Pro on Modal with thinking on (Think High), so the reasoning text is logged
# (calls.jsonl: response.choices[0].message.reasoning). Server: deploy/models/deepseek-v4-pro-thinking.env.
#   make modal-run STUDY=configs/studies/<study>.yaml MODAL=deepseek-v4-pro-thinking
# Thinking switch and sampling from vLLM's DeepSeek-V4-Pro recipe (0813, agentic: temperature 1.0,
# top_p 0.95); not Colosseum's temperature 0.7.
extends: ./modal-deepseek-v4-pro.yaml
label: modal-deepseek-v4-pro-thinking
temperature: 1.0
max_tokens: 16000                    # thinking + answer; prompt (< 2,000 tokens) + 16,000 fits MAX_MODEL_LEN 32768
timeout_s: 1800
extra_body:
  top_p: 0.95
  chat_template_kwargs: {thinking: true, reasoning_effort: high}
stop_on_error: true                  # a stopped server (spending limit, hard stop) ends the episode, finished
                                     # rounds kept, instead of random fills of the claims
