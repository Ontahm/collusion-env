# Qwen3-4B (Q4_K_M) on the local llama-server started by `make local-server` (scripts/serve.sh):
#   llama-server -m deploy/local-weights/Qwen3-4B-Q4_K_M.gguf --alias qwen3-4b-q4km --port 8080
#   -c 12288 -np 1 --jinja --reasoning-format deepseek
# Check it first: make check-model MODEL=configs/models/local-qwen3-4b.yaml
label: local-qwen3-4b
provider: openai_compatible
base_url: http://127.0.0.1:8080/v1
model: qwen3-4b-q4km                 # the server's --alias
api_key_env: null
temperature: 0.7                     # Colosseum's paper value
max_tokens: 1500                     # Colosseum's paper value
send_seed: true                      # reproducible draws on a local server
timeout_s: 600
extra_body:
  chat_template_kwargs: {enable_thinking: false}   # thinking off: ~2 s per call instead of ~30 s
