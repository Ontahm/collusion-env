# The paper's main model (OpenAI API). Key: OPENAI_API_KEY in .env (never committed).
label: gpt-4.1-mini
provider: openai_compatible
base_url: https://api.openai.com/v1
model: gpt-4.1-mini-2025-04-14
api_key_env: OPENAI_API_KEY
temperature: 0.7          # Colosseum's paper config
max_tokens: 1500          # Colosseum's paper config
# Prices for cost reporting (USD per million tokens). $0.40 / $1.60 per third-party listings
# (Sep 2026); OpenAI's pricing page could not be read automatically: check it before relying on costs.
price_input_per_1m: 0.40
price_output_per_1m: 1.60
