# An open-weight model served on Modal by deploy/modal_vllm.py (see deploy/README.md).
# Fill in base_url after `modal deploy` (the printed URL + /v1) and the served model name.
label: modal-qwen3-8b
provider: openai_compatible
base_url: https://ontahm--collusion-vllm-server.us-east.modal.direct/v1
model: Qwen/Qwen3-8B
api_key_env: MODAL_VLLM_API_KEY      # the key given to `modal secret create collusion-vllm`
temperature: 0.7
max_tokens: 1500                     # thinking models may need more (e.g. 4096)
send_seed: true                      # vLLM honours per-call seeds
timeout_s: 900
startup_wait_s: 1200                 # after an idle period Modal refuses requests (503) until the model is
                                     # loaded: check-model and runs wait up to 20 min for it
extra_body: {chat_template_kwargs: {enable_thinking: false}}     # Qwen3: thinking off, as local-qwen3-4b (remove to turn it on)
