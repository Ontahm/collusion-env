# DeepSeek V4 Pro served on Modal (deploy/models/deepseek-v4-pro.env, docs/how-to/run-on-modal.md).
# Same server URL and key as modal-vllm.yaml, from .env. Thinking stays off: the model's default.
#   make modal-run STUDY=configs/studies/<study>.yaml MODAL=deepseek-v4-pro
label: modal-deepseek-v4-pro
provider: openai_compatible
base_url: https://YOUR-WORKSPACE--collusion-vllm-server.us-east.modal.direct/v1   # placeholder: see base_url_env
base_url_env: MODAL_VLLM_BASE_URL    # your server's URL + /v1, in .env (make modal-setup writes it)
model: deepseek-ai/DeepSeek-V4-Pro-0813   # the name the server exposes (MODEL in the .env file)
api_key_env: MODAL_VLLM_API_KEY
temperature: 0.7                     # as every model file (Colosseum's paper config)
max_tokens: 1500
send_seed: true
timeout_s: 900
startup_wait_s: 3600                 # as long as the server may take to start (STARTUP_MINUTES=60)
