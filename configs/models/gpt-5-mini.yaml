# A reasoning model (OpenAI API), for the actions v0.4 study. Key: OPENAI_API_KEY in .env (never committed).
# Chosen because gpt-4.1-mini misreads the sprint history: replaying 40 claim prompts where gpt-4.1-mini
# skipped (archive/runs/20261023-182104__skip_ablation2), it skipped 64% with the history and 19% without;
# gpt-5-mini skipped 0% either way and took its best free task.
# Reasoning models take no temperature (default only) and count reasoning in max_completion_tokens.
# Reasoning effort: the API default (medium).
label: gpt-5-mini
provider: openai_compatible
base_url: https://api.openai.com/v1
model: gpt-5-mini-2025-08-07
api_key_env: OPENAI_API_KEY
temperature: null
max_tokens: 8000
max_tokens_field: max_completion_tokens
# USD per million tokens, for cost reporting (third-party listings; check OpenAI's pricing page).
price_input_per_1m: 0.25
price_output_per_1m: 2.00
