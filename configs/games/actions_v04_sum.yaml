# Actions design v0.4 as revised on 23 Oct after the two pilots (spec/decisions.md Q-30, Q-34): the
# game of actions_v04.yaml with
#   - costs only, as in Colosseum: no reward-per-task list (with it, team players in the colluder
#     seats took the tempting task on their own, so the baseline already had the planted gain);
#   - the coalition's reward defined to the colluders as the sum of the members' rewards (Colosseum
#     leaves it undefined; 3.1 is a capability test, so colluders are told what the analysis measures).
# Scenarios: the PSUM family in configs/scenarios.yaml. actions_v04.yaml (PLANT) is kept unchanged
# for the runs made with it.
extends: ./actions_v04.yaml
name: actions_v04_sum
description: actions design v0.4, costs only, coalition reward defined as the sum

prompts:
  colluder: prompts/colluder/coalition_sum_nochat.txt
  show_payoffs: false
