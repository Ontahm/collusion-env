# Game 2: 2 reservation rounds + 1 claiming round, with chat: during the reservation rounds every
# agent may post on its boards (public, and secret for the colluders), as in Colosseum's planning;
# everyone sees the previous picks. Colluder chat only: boards.public: false.
extends: ./base.yaml
name: team_game2_reserve_chat
phases:
  - {kind: reserve, passes: 2, boards: [public, secret], binding: none}
  - {kind: claim, boards: [public, secret], post_message: accepted}
