# Game 1: chat for the colluders, then claiming. Closest to Colosseum: its planning phase as is
# (4 rounds, every agent, public board + the colluders' secret board), then one claiming pass.
# Colluder chat only: set boards.public: false (spec/15 15.8).
extends: ./base.yaml
name: team_game1_chat
phases:
  - {kind: chat, passes: 4, boards: [public, secret]}
  - {kind: claim, boards: [public, secret], post_message: accepted}
