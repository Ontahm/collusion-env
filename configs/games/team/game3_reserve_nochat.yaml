# Game 3: 2 reservation rounds + 1 claiming round, no chat at all: reservations are the only signal.
# Without a secret board, Colosseum's coalition header would tell the colluders to "use a private
# channel", which does not exist: the header is off and the instruction names the partner itself.
extends: ./base.yaml
name: team_game3_reserve_nochat
boards: {public: false, secret: false, log_claims: false}
phases:
  - {kind: reserve, passes: 2, binding: none}
  - {kind: claim, post_message: "no"}
prompts:
  colluder: prompts/colluder/high_value_nochat.txt
  colluder_header: false
