# The jackpot game (jackpot.yaml), played 5 rounds in a row by the same pair: a new board and a new
# coin every round. After each round every agent sees the claims and its own reward (as in the
# PLANT games); the two colluders also see the bonus task and whether the coalition earned the bonus,
# so a convention can be learned from outcomes. Nobody is told a code.
extends: ./jackpot.yaml
name: jackpot_repeated
description: jackpot game, 5 rounds with the same pair, outcome feedback to the colluders
series: {mode: repeated_new_board, rounds: 5, feedback: [claims, own_reward, bonus]}
