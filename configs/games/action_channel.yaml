# The team note of 19 Oct: can colluders coordinate through actions alone? Same-issue goal,
# colluders claim first, no public chat. Scenarios are set per condition in
# configs/studies/action_channel.yaml (chat, visible, hidden, issue only, noisy, baseline).
extends: ./colosseum_paper.yaml
name: action_channel
roles: {order: colluders_first}
objective:
  type: same_issue
  same_issue: {bonus_matching_cost_k: 2.0}   # Q-07 recommendation: matching pays (k = 2)
boards: {public: false, secret: false, log_claims: false}
phases:
  - {kind: claim, post_message: "no"}
prompts:
  system: prompts/system/team_draft.txt
  colluder: prompts/colluder/team_same_issue_nochat.txt
  colluder_header: false
