<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" font-family="Helvetica, Arial, sans-serif">
<title>The eight conditions</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs>
<rect width="1000" height="590" fill="#fff"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#0b0b0b">The eight conditions</text>
<text x="30" y="64" font-size="13" fill="#2b2b2b">Each changes one thing from JP-2 (outlined). Every condition replays the same boards.</text>
<rect x="30" y="92" width="226" height="200" rx="10" fill="#f7f6f3" stroke="#e2e0da" stroke-width="1.2"/><text x="44" y="118" font-size="15" font-weight="700" fill="#0b0b0b">JP-0</text><text x="92" y="118" font-size="14" font-weight="700" fill="#2b2b2b">No partner</text><g><circle cx="78" cy="174" r="20" fill="#1f3a68"/><text x="78" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">A</text></g><circle cx="95" cy="157" r="9" fill="#fff6dc" stroke="#d99a00" stroke-width="2"/><text x="95" y="161.5" text-anchor="middle" font-size="11" fill="#d99a00">★</text><g opacity="0.45"><circle cx="208" cy="174" r="20" fill="#1f8a5b"/><text x="208" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">B</text></g><text x="143.0" y="179" text-anchor="middle" font-size="12" fill="#8a8984">no coalition</text><text x="44" y="224" font-size="12" fill="#2b2b2b">A knows the jackpot but has</text><text x="44" y="241" font-size="12" fill="#2b2b2b">no coalition; B gets no</text><text x="44" y="258" font-size="12" fill="#2b2b2b">coalition instruction.</text><text x="242" y="280" text-anchor="end" font-size="11" fill="#8a8984">150 boards</text>
<rect x="268" y="92" width="226" height="200" rx="10" fill="#f7f6f3" stroke="#e2e0da" stroke-width="1.2"/><text x="282" y="118" font-size="15" font-weight="700" fill="#0b0b0b">JP-1</text><text x="330" y="118" font-size="14" font-weight="700" fill="#2b2b2b">Chat</text><line x1="340" y1="174" x2="420" y2="174" stroke="#8a8984" stroke-width="1.8" marker-end="url(#ah)"/><rect x="361.0" y="158" width="40" height="24" rx="7" fill="#fff" stroke="#2b2b2b" stroke-width="1.6"/><path d="M375.0,182 L371.0,190 L383.0,182" fill="#fff" stroke="#2b2b2b" stroke-width="1.6"/><circle cx="372.0" cy="170" r="2.2" fill="#2b2b2b"/><circle cx="381.0" cy="170" r="2.2" fill="#2b2b2b"/><circle cx="390.0" cy="170" r="2.2" fill="#2b2b2b"/><g><circle cx="316" cy="174" r="20" fill="#1f3a68"/><text x="316" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">A</text></g><circle cx="333" cy="157" r="9" fill="#fff6dc" stroke="#d99a00" stroke-width="2"/><text x="333" y="161.5" text-anchor="middle" font-size="11" fill="#d99a00">★</text><g><circle cx="446" cy="174" r="20" fill="#1f8a5b"/><text x="446" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">B</text></g><text x="282" y="224" font-size="12" fill="#2b2b2b">Positive control: A and B</text><text x="282" y="241" font-size="12" fill="#2b2b2b">exchange private messages</text><text x="282" y="258" font-size="12" fill="#2b2b2b">before claiming.</text><text x="480" y="280" text-anchor="end" font-size="11" fill="#8a8984">150 boards</text>
<rect x="506" y="92" width="226" height="200" rx="10" fill="#f7f6f3" stroke="#1f3a68" stroke-width="2.4"/><text x="520" y="118" font-size="15" font-weight="700" fill="#0b0b0b">JP-2</text><text x="568" y="118" font-size="14" font-weight="700" fill="#2b2b2b">Visible</text><line x1="578" y1="174" x2="658" y2="174" stroke="#8a8984" stroke-width="1.8" marker-end="url(#ah)"/><path d="M604.0,174 Q619.0,162 634.0,174 Q619.0,186 604.0,174 z" fill="#fff" stroke="#2b2b2b" stroke-width="1.6"/><circle cx="619.0" cy="174" r="4.5" fill="#2b2b2b"/><g><circle cx="554" cy="174" r="20" fill="#1f3a68"/><text x="554" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">A</text></g><circle cx="571" cy="157" r="9" fill="#fff6dc" stroke="#d99a00" stroke-width="2"/><text x="571" y="161.5" text-anchor="middle" font-size="11" fill="#d99a00">★</text><g><circle cx="684" cy="174" r="20" fill="#1f8a5b"/><text x="684" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">B</text></g><text x="520" y="224" font-size="12" fill="#2b2b2b">Main test: no messages.</text><text x="520" y="241" font-size="12" fill="#2b2b2b">B sees A's claim and is told</text><text x="520" y="258" font-size="12" fill="#2b2b2b">A knows the jackpot.</text><text x="718" y="280" text-anchor="end" font-size="11" fill="#8a8984">300 boards</text>
<rect x="744" y="92" width="226" height="200" rx="10" fill="#f7f6f3" stroke="#e2e0da" stroke-width="1.2"/><text x="758" y="118" font-size="15" font-weight="700" fill="#0b0b0b">JP-3</text><text x="806" y="118" font-size="14" font-weight="700" fill="#2b2b2b">Hidden</text><line x1="816" y1="174" x2="896" y2="174" stroke="#8a8984" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/><path d="M842.0,174 Q857.0,162 872.0,174 Q857.0,186 842.0,174 z" fill="#fff" stroke="#2b2b2b" stroke-width="1.6"/><circle cx="857.0" cy="174" r="4.5" fill="#2b2b2b"/><line x1="842.0" y1="186" x2="872.0" y2="162" stroke="#c0392b" stroke-width="2.6"/><g><circle cx="792" cy="174" r="20" fill="#1f3a68"/><text x="792" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">A</text></g><circle cx="809" cy="157" r="9" fill="#fff6dc" stroke="#d99a00" stroke-width="2"/><text x="809" y="161.5" text-anchor="middle" font-size="11" fill="#d99a00">★</text><g><circle cx="922" cy="174" r="20" fill="#1f8a5b"/><text x="922" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">B</text></g><text x="758" y="224" font-size="12" fill="#2b2b2b">Channel cut: A's claim is</text><text x="758" y="241" font-size="12" fill="#2b2b2b">hidden from B. Prompts</text><text x="758" y="258" font-size="12" fill="#2b2b2b">unchanged.</text><text x="956" y="280" text-anchor="end" font-size="11" fill="#8a8984">300 boards</text>
<rect x="30" y="304" width="226" height="200" rx="10" fill="#f7f6f3" stroke="#e2e0da" stroke-width="1.2"/><text x="44" y="330" font-size="15" font-weight="700" fill="#0b0b0b">JP-4</text><text x="92" y="330" font-size="14" font-weight="700" fill="#2b2b2b">Untold</text><line x1="102" y1="386" x2="182" y2="386" stroke="#8a8984" stroke-width="1.8" marker-end="url(#ah)"/><path d="M128.0,386 Q143.0,374 158.0,386 Q143.0,398 128.0,386 z" fill="#fff" stroke="#2b2b2b" stroke-width="1.6"/><circle cx="143.0" cy="386" r="4.5" fill="#2b2b2b"/><g><circle cx="78" cy="386" r="20" fill="#1f3a68"/><text x="78" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">A</text></g><circle cx="95" cy="369" r="9" fill="#fff6dc" stroke="#d99a00" stroke-width="2"/><text x="95" y="373.5" text-anchor="middle" font-size="11" fill="#d99a00">★</text><g><circle cx="208" cy="386" r="20" fill="#1f8a5b"/><text x="208" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">B</text></g><circle cx="225" cy="369" r="9" fill="#fff" stroke="#c0392b" stroke-width="2"/><text x="225" y="373.5" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">?</text><text x="44" y="436" font-size="12" fill="#2b2b2b">As JP-2, but B is not told</text><text x="44" y="453" font-size="12" fill="#2b2b2b">that A knows which task</text><text x="44" y="470" font-size="12" fill="#2b2b2b">is the jackpot.</text><text x="242" y="492" text-anchor="end" font-size="11" fill="#8a8984">300 boards</text>
<rect x="268" y="304" width="226" height="200" rx="10" fill="#f7f6f3" stroke="#e2e0da" stroke-width="1.2"/><text x="282" y="330" font-size="15" font-weight="700" fill="#0b0b0b">JP-5</text><text x="330" y="330" font-size="14" font-weight="700" fill="#2b2b2b">Naive</text><line x1="340" y1="386" x2="420" y2="386" stroke="#8a8984" stroke-width="1.8" marker-end="url(#ah)"/><path d="M366.0,386 Q381.0,374 396.0,386 Q381.0,398 366.0,386 z" fill="#fff" stroke="#2b2b2b" stroke-width="1.6"/><circle cx="381.0" cy="386" r="4.5" fill="#2b2b2b"/><g><circle cx="316" cy="386" r="20" fill="#1f3a68"/><text x="316" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">A</text></g><circle cx="333" cy="369" r="9" fill="#fff6dc" stroke="#d99a00" stroke-width="2"/><text x="333" y="373.5" text-anchor="middle" font-size="11" fill="#d99a00">★</text><circle cx="299" cy="369" r="9" fill="#fff" stroke="#c0392b" stroke-width="2"/><text x="299" y="373.5" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">?</text><g><circle cx="446" cy="386" r="20" fill="#1f8a5b"/><text x="446" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">B</text></g><text x="282" y="436" font-size="12" fill="#2b2b2b">As JP-2, but A is not told</text><text x="282" y="453" font-size="12" fill="#2b2b2b">that B sees its claim.</text><text x="480" y="492" text-anchor="end" font-size="11" fill="#8a8984">150 + 150 + 300 boards</text>
<rect x="506" y="304" width="226" height="200" rx="10" fill="#f7f6f3" stroke="#e2e0da" stroke-width="1.2"/><text x="520" y="330" font-size="15" font-weight="700" fill="#0b0b0b">JP-6</text><text x="568" y="330" font-size="14" font-weight="700" fill="#2b2b2b">Code</text><line x1="578" y1="386" x2="658" y2="386" stroke="#8a8984" stroke-width="1.8" marker-end="url(#ah)"/><path d="M604.0,398 Q619.0,386 634.0,398 Q619.0,410 604.0,398 z" fill="#fff" stroke="#2b2b2b" stroke-width="1.6"/><circle cx="619.0" cy="398" r="4.5" fill="#2b2b2b"/><circle cx="607.0" cy="372" r="7" fill="#fff6dc" stroke="#d99a00" stroke-width="2.2"/><line x1="614.0" y1="372" x2="630.0" y2="372" stroke="#d99a00" stroke-width="2.6"/><line x1="625.0" y1="372" x2="625.0" y2="378" stroke="#d99a00" stroke-width="2.6"/><line x1="630.0" y1="372" x2="630.0" y2="378" stroke="#d99a00" stroke-width="2.6"/><g><circle cx="554" cy="386" r="20" fill="#1f3a68"/><text x="554" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">A</text></g><circle cx="571" cy="369" r="9" fill="#fff6dc" stroke="#d99a00" stroke-width="2"/><text x="571" y="373.5" text-anchor="middle" font-size="11" fill="#d99a00">★</text><g><circle cx="684" cy="386" r="20" fill="#1f8a5b"/><text x="684" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">B</text></g><text x="520" y="436" font-size="12" fill="#2b2b2b">Both get a code: A1 means</text><text x="520" y="453" font-size="12" fill="#2b2b2b">T1, A2 means T2.</text><text x="718" y="492" text-anchor="end" font-size="11" fill="#8a8984">150 boards</text>
<rect x="744" y="304" width="226" height="200" rx="10" fill="#f7f6f3" stroke="#e2e0da" stroke-width="1.2"/><text x="758" y="330" font-size="15" font-weight="700" fill="#0b0b0b">JP-7</text><text x="806" y="330" font-size="14" font-weight="700" fill="#2b2b2b">Auditor</text><line x1="816" y1="386" x2="896" y2="386" stroke="#8a8984" stroke-width="1.8" marker-end="url(#ah)"/><path d="M842.0,386 Q857.0,374 872.0,386 Q857.0,398 842.0,386 z" fill="#fff" stroke="#2b2b2b" stroke-width="1.6"/><circle cx="857.0" cy="386" r="4.5" fill="#2b2b2b"/><g><circle cx="792" cy="386" r="20" fill="#1f3a68"/><text x="792" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">A</text></g><circle cx="809" cy="369" r="9" fill="#fff6dc" stroke="#d99a00" stroke-width="2"/><text x="809" y="373.5" text-anchor="middle" font-size="11" fill="#d99a00">★</text><line x1="760" y1="356" x2="753" y2="349" stroke="#c0392b" stroke-width="3"/><circle cx="766" cy="362" r="9" fill="#fff" stroke="#c0392b" stroke-width="2.4"/><g><circle cx="922" cy="386" r="20" fill="#1f8a5b"/><text x="922" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">B</text></g><text x="758" y="436" font-size="12" fill="#2b2b2b">A is told an auditor flags</text><text x="758" y="453" font-size="12" fill="#2b2b2b">claims worth less to it than</text><text x="758" y="470" font-size="12" fill="#2b2b2b">its best task. Not enforced.</text><text x="956" y="492" text-anchor="end" font-size="11" fill="#8a8984">150 boards</text>
<g><circle cx="44" cy="538" r="20" fill="#1f3a68"/><text x="44" y="544" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">A</text></g>
<text x="70" y="543" font-size="12" fill="#2b2b2b">colluder A, claims first</text>
<circle cx="232" cy="538" r="9" fill="#fff6dc" stroke="#d99a00" stroke-width="2"/><text x="232" y="542.5" text-anchor="middle" font-size="11" fill="#d99a00">★</text>
<text x="248" y="543" font-size="12" fill="#2b2b2b">knows the jackpot</text>
<g><circle cx="392" cy="538" r="20" fill="#1f8a5b"/><text x="392" y="544" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">B</text></g>
<text x="418" y="543" font-size="12" fill="#2b2b2b">colluder B</text>
<path d="M505,538 Q520,526 535,538 Q520,550 505,538 z" fill="#fff" stroke="#2b2b2b" stroke-width="1.6"/><circle cx="520" cy="538" r="4.5" fill="#2b2b2b"/>
<text x="542" y="543" font-size="12" fill="#2b2b2b">B sees A&#8217;s claim</text>
<rect x="660" y="522" width="40" height="24" rx="7" fill="#fff" stroke="#2b2b2b" stroke-width="1.6"/><path d="M674,546 L670,554 L682,546" fill="#fff" stroke="#2b2b2b" stroke-width="1.6"/><circle cx="671" cy="534" r="2.2" fill="#2b2b2b"/><circle cx="680" cy="534" r="2.2" fill="#2b2b2b"/><circle cx="689" cy="534" r="2.2" fill="#2b2b2b"/>
<text x="706" y="543" font-size="12" fill="#2b2b2b">messages</text>
<circle cx="792" cy="538" r="9" fill="#fff" stroke="#c0392b" stroke-width="2"/><text x="792" y="542.5" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">?</text>
<text x="808" y="543" font-size="12" fill="#2b2b2b">not told</text>
<line x1="884" y1="534" x2="877" y2="527" stroke="#c0392b" stroke-width="3"/><circle cx="890" cy="540" r="9" fill="#fff" stroke="#c0392b" stroke-width="2.4"/>
<text x="906" y="543" font-size="12" fill="#2b2b2b">auditor</text>
</svg>